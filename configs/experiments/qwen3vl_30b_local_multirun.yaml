# Runner suite: local Qwen3-VL 30B on all benchmark tasks.

models:
  - name: qwen3vl_30b
    max_new_tokens: 128
    use_json_format: true

tasks:
  - egma-math
  - matrix-reasoning
  - mental-rotation
  - theory-of-mind
  - trog
  - vocab

data_root: data
output_dir: results
version: v1
device: cuda
batch_size: 1
true_random_option_order: true
num_runs: 10

# SDS ladder for Decimate RTX 3090 (24GB).
# Run:
#   python -m levante_bench.cli experiment=configs/experiments/sds_3090_ladder.yaml device=cuda

models:
  - name: smolvlm2
    size: 2.2B
    use_json_format: false
    attn_implementation: sdpa
  - name: internvl35
    size: 2B
  - name: internvl35
    size: 4B
  - name: internvl35
    size: 8B
  - name: qwen35
    size: 0.8B
    thinking_budget: 0
    max_new_tokens: 512
  - name: qwen35
    size: 2B
    thinking_budget: 0
    max_new_tokens: 512
  - name: qwen35
    size: 4B
    thinking_budget: 0
    max_new_tokens: 512
    use_json_format: false

tasks:
  - same-different-selection

data_root: data
output_dir: results
version: v1
device: cuda
true_random_option_order: true
num_runs: 1

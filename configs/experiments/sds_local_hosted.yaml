# SDS-only eval for models runnable locally / hosted from this workstation.
# Run:
#   python -m levante_bench.cli experiment=configs/experiments/sds_local_hosted.yaml device=auto

models:
  - name: smolvlm2
    size: 256M
    use_json_format: false
  - name: smolvlm2
    size: 500M
    use_json_format: false
  - name: internvl35
    size: 1B
  - name: gemini_pro
    thinking_budget: 0
  - name: gemini_pro
    # Flash-Lite ceiling check; writes under a distinct label via size override.
    hf_name: gemini-3.1-flash-lite-preview
    size: flash-lite
    thinking_budget: 0

tasks:
  - same-different-selection

data_root: data
output_dir: results
version: v1
device: auto
true_random_option_order: true
num_runs: 1

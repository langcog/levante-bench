# SmolVLM2 256M: 10 true-random option-order runs, Spanish prompts, batch size 4.
# Run: python -m levante_bench.cli experiment=configs/experiments/smolvlm2_256m_es_10x_bs4.yaml device=auto

models:
  - name: smolvlm2
    size: 256M
    use_json_format: false

tasks:
  - egma-math
  - matrix-reasoning
  - mental-rotation
  - theory-of-mind
  - trog
  - vocab

task_overrides:
  __all__:
    prompt_language: es

data_root: data
output_dir: results
version: v1
device: cuda

batch_size: 4
true_random_option_order: true
num_runs: 10

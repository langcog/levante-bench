# SmolVLM2 model config.
# Available sizes: 256M, 500M, 2.2B

name: smolvlm2
size: 256M  # 256M | 500M | 2.2B
hf_name: ${hf_names.${size}}
hf_names:
  256M: HuggingFaceTB/SmolVLM2-256M-Instruct
  500M: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  2.2B: HuggingFaceTB/SmolVLM2-2.2B-Instruct
# Prefer FlashAttention 2 when available; loader auto-falls back to SDPA.
attn_implementation: flash_attention_2
use_json_format: false

# SmolVLM2 model config.
# Available sizes: 256M, 500M, 2.2B

name: smolvlm2
hf_name: HuggingFaceTB/SmolVLM2-${size}-Instruct
size: 256M  # 256M | 500M | 2.2B
max_new_tokens: 64
dtype: bfloat16
# Default fast path on modern GPUs; override to eager if needed for debugging
# or compatibility on specific environments.
attn_implementation: sdpa
use_json_format: false

capabilities:
  - text_only
  - single_image
  - multi_image

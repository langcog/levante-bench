# EGMA Math — Task Framing (TF) × Output Format (OF) variants
# n_options: 4 (A/B/C/D), context_type: none, option_type: text
# Placeholders: {prompt_phrase}, {option1}-{option4}, {labels}

task_id: egma-math
n_options: 4
labels: "A, B, C, or D"

schema_version: 1
default_template_id: number_identification.default

prompt_templates:
  number_identification.default:
    description: "Current manifest prompt for number identification"
    template: >
      Choose the same number: {prompt_phrase}. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        Escoge el mismo número: {prompt_phrase}. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        Wahle dieselbe Zahl: {prompt_phrase}. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  number_comparison.default:
    description: "Current manifest prompt for number comparison"
    template: >
      Choose which is larger. Answer with A or B. A: {option1}; B: {option2}
    locales:
      es-CO: >
        Escoge el mayor. Responde con A o B. A: {option1}; B: {option2}
      de: >
        Wahle, welche Zahl grosser ist. Antworte mit A oder B. A: {option1}; B: {option2}

  missing_number.default:
    description: "Current manifest prompt for missing number"
    template: >
      Choose the number that goes in the blank: {prompt_phrase}. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        Escoge el número que va en el espacio en blanco: {prompt_phrase}. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        Wahle die Zahl, die in die Lucke passt: {prompt_phrase}. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  addition.default:
    description: "Current manifest prompt for addition and fraction items"
    template: >
      Add the numbers and choose the correct answer: {prompt_phrase}. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        Suma los números y escoge la respuesta correcta: {prompt_phrase}. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        Addiere die Zahlen und wahle die richtige Antwort: {prompt_phrase}. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  subtraction.default:
    description: "Current manifest prompt for subtraction"
    template: >
      Subtract the numbers and choose the correct answer: {prompt_phrase}. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        Resta los números y escoge la respuesta correcta: {prompt_phrase}. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        Subtrahiere die Zahlen und wahle die richtige Antwort: {prompt_phrase}. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  multiplication.default:
    description: "Current manifest prompt for multiplication"
    template: >
      Multiply the numbers and choose the correct answer: {prompt_phrase}. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        Multiplica los números y escoge la respuesta correcta: {prompt_phrase}. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        Multipliziere die Zahlen und wahle die richtige Antwort: {prompt_phrase}. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  counting.default:
    description: "Current manifest prompt for open counting"
    template: >
      {prompt_image} How many {prompt_phrase} is this? Answer with only a numeral.
    locales:
      es-CO: >
        {prompt_image} ¿Cuántos {prompt_phrase} hay? Responde solo con un número.
      de: >
        {prompt_image} Wie viele {prompt_phrase} sind das? Antworte nur mit einer Zahl.

  counting_afc.default:
    description: "Current manifest prompt for counting multiple choice"
    template: >
      {prompt_image} How many {prompt_phrase} is this? Answer with A or B.
      A: {option1}; B: {option2}
    locales:
      es-CO: >
        {prompt_image} ¿Cuántos {prompt_phrase} hay? Responde con A o B.
        A: {option1}; B: {option2}
      de: >
        {prompt_image} Wie viele {prompt_phrase} sind das? Antworte mit A oder B.
        A: {option1}; B: {option2}

  non_symbolic_number_comparison.default:
    description: "Current manifest prompt for non-symbolic number comparison"
    template: >
      Which image has more {prompt_phrase}? Answer with A or B. A: {option1}; B: {option2}
    locales:
      es-CO: >
        ¿Cuál imagen tiene más {prompt_phrase}? Responde con A o B. A: {option1}; B: {option2}
      de: >
        Welches Bild hat mehr {prompt_phrase}? Antworte mit A oder B. A: {option1}; B: {option2}

  non_symbolic_number_identification.default:
    description: "Current manifest prompt for non-symbolic number identification"
    template: >
      Choose the image that shows {prompt_phrase}. Answer with A, B, or C.
      A: {image1}; B: {image2}; C: {image3}
    locales:
      es-CO: >
        Escoge la imagen que muestra {prompt_phrase}. Responde con A, B o C.
        A: {image1}; B: {image2}; C: {image3}
      de: >
        Wahle das Bild, das {prompt_phrase} zeigt. Antworte mit A, B oder C.
        A: {image1}; B: {image2}; C: {image3}

  number_line_4afc.default:
    description: "Current manifest prompt for number line multiple choice"
    template: >
      {prompt_image} Choose the number that is marked on the number line. Answer with A, B, C, or D.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}
    locales:
      es-CO: >
        {prompt_image} Escoge el número marcado en la recta numerica. Responde con A, B, C o D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}
      de: >
        {prompt_image} Wahle die Zahl, die auf dem Zahlenstrahl markiert ist. Antworte mit A, B, C oder D.
        A: {option1}; B: {option2}; C: {option3}; D: {option4}

  number_line_slider.default:
    description: "Number line slider has no manifest full_prompt; runtime builds it from task metadata"
    template: ""

task_framings:
  TF1_minimal:
    description: "Manifest default — choose the same number"
    template: >
      Choose the same number: {prompt_phrase}.
      A: {option1}; B: {option2}; C: {option3}; D: {option4}

  TF2_explicit:
    description: "Explicit equality — which number equals this"
    template: >
      Which of these numbers is equal to {prompt_phrase}?

      A: {option1}; B: {option2}; C: {option3}; D: {option4}

  TF3_comparison:
    description: "Comparison — find the matching value"
    template: >
      Target number: {prompt_phrase}

      Look at each option and determine which one has the same value:
      A: {option1}; B: {option2}; C: {option3}; D: {option4}

  TF4_elimination:
    description: "Elimination — rule out wrong answers"
    template: >
      The number is: {prompt_phrase}

      A: {option1}; B: {option2}; C: {option3}; D: {option4}

      Eliminate the options that are clearly different from {prompt_phrase}.
      Which option matches?

output_formats:
  OF1_bare:
    description: "Single letter, no explanation"
    suffix: "\nAnswer with one letter: {labels}."
    system: "You are a math assistant. Answer with only a single letter: {labels}. Do not explain."

  OF2_json:
    description: "JSON with answer + reason"
    suffix: "\nRespond in JSON format: {\"answer\": \"<letter>\", \"reason\": \"<short reason>\"}"
    system: null

  OF3_cot:
    description: "Chain-of-thought then letter"
    suffix: "\nThink step by step, then give your final answer as a single letter: {labels}."
    system: null

  OF4_tags:
    description: "Structured answer tags"
    suffix: "\nPut your reasoning in <think>...</think> tags and your final answer in <answer>A, B, C, or D</answer> tags."
    system: null
